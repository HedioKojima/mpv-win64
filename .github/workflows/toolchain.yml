name: toolchain

on:
  workflow_dispatch:
  schedule:
  - cron: '25 0 * * 4'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Resolve latest GCC-MCF
      id: resolve
      shell: bash
      run: |
        html=$(curl -k --ssl-no-revoke -sSL --resolve "gcc-mcf.lhmouse.com:443:204.152.213.15" https://gcc-mcf.lhmouse.com/)
        best=$(printf '%s\n' "$html" | grep -oE 'mingw-w64-gcc-mcf_[0-9]{8}_[0-9]+\.[0-9]+\.[0-9]+_x64-ucrt_[0-9a-f]{40}\.7z' | sort -r | head -n1)
        if [ -z "$best" ]; then
          echo "No GCC-MCF x64-ucrt archive found" >&2
          exit 1
        fi
        date=$(printf '%s\n' "$best" | sed -E 's/^mingw-w64-gcc-mcf_([0-9]{8})_.*/\1/')
        version=$(printf '%s\n' "$best" | sed -E 's/^mingw-w64-gcc-mcf_[0-9]{8}_([0-9]+\.[0-9]+\.[0-9]+)_x64-ucrt_.*/\1/')
        hash=$(printf '%s\n' "$best" | sed -E 's/.*_x64-ucrt_([0-9a-f]{40})\.7z/\1/')
        {
          echo "file=$best"
          echo "date=$date"
          echo "version=$version"
          echo "cache_key=mcf_${date}_${version}_${hash:0:8}_x64-ucrt"
        } >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      id: cache
      with:
        path: D:\msys64
        key: ${{ steps.resolve.outputs.cache_key }}
    - name: Setup Toolchain
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        curl.exe -k --ssl-no-revoke -o "${{ steps.resolve.outputs.file }}" "https://gcc-mcf.lhmouse.com/${{ steps.resolve.outputs.file }}" --resolve "gcc-mcf.lhmouse.com:443:204.152.213.15"
        &'C:\Program Files\7-Zip\7z.exe' x "${{ steps.resolve.outputs.file }}" -o'D:'
    - name: Prepare
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v6
    - name: Make Toolchain
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        C:\msys64\usr\bin\bash -lc 'pacman -Sy base-devel compression git autoconf-wrapper automake-wrapper libtool mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-python-mako --noconfirm'
        C:\msys64\usr\bin\bash -lc 'pacman -Sydd mingw-w64-ucrt-x86_64-shaderc --noconfirm'
        C:\msys64\usr\bin\bash -lc 'pacman -Scc --noconfirm'
        xcopy /e C:\msys64 D:\msys64\
        xcopy /e /y D:\ucrt64 D:\msys64\ucrt64
        D:\msys64\usr\bin\bash -lc 'cd /d/a/mpv-win64/mpv-win64/mcfgthread; PATH=/usr/bin:/opt/bin:/ucrt64/bin PKG_CONFIG_PATH=/opt/lib/pkgconfig makepkg'
    - name: Delete Bleeding Edge V3
      if: steps.cache.outputs.cache-hit != 'true'
      uses: mknejp/delete-release-assets@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: bleeding_edge-x86-64-v3
        assets: mcfgthread*
        fail-if-no-assets: false
        fail-if-no-release: false
    - name: Upload Bleeding Edge V3
      if: steps.cache.outputs.cache-hit != 'true'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: mcfgthread/*pkg*.xz
        tag: bleeding_edge-x86-64-v3
        overwrite: true
        file_glob: true
