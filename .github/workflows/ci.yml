name: CI

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/cache/restore@v5
      with:
        path: D:\msys64
        key: mcf_current
        restore-keys: mcf_
    - name: Prepare
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v6
    - uses: mxschmitt/action-tmate@v3
